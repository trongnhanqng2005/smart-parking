spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER}
    password: ${SPRING_FLYWAY_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
    cookie:
      http-only: true
      secure: true
      same-site: lax
smart-parking:
  security:
    jwt:
      secret: ${SMART_PARKING_JWT_SECRET:}
      issuer: smart-parking
      audience: smart-parking-api
      access-token-ttl: 12h
    bootstrap:
      username: ${SMART_PARKING_BOOTSTRAP_MANAGEMENT_USERNAME:}
      password: ${SMART_PARKING_BOOTSTRAP_MANAGEMENT_PASSWORD:}
      full-name: ${SMART_PARKING_BOOTSTRAP_MANAGEMENT_FULL_NAME:}
